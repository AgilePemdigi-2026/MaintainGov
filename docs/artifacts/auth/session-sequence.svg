 x2="370.5" y1="698.0781" y2="698.0781"/><text fill="#000000" font-family="Serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="24" x="184.5" y="693.0122">200</text><polygon fill="#383838" points="359.5,723.2109,369.5,727.2109,359.5,731.2109,363.5,727.2109" style="stroke: #383838; stroke-width: 1.0;"/><line style="stroke: #383838; stroke-width: 1.0;" x1="167.5" x2="365.5" y1="727.2109" y2="727.2109"/><text fill="#000000" font-family="Serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="180" x="174.5" y="722.145">request dengan cookie lama</text><polygon fill="#383838" points="178.5,752.3438,168.5,756.3438,178.5,760.3438,174.5,756.3438" style="stroke: #383838; stroke-width: 1.0;"/><line style="stroke: #383838; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="172.5" x2="370.5" y1="756.3438" y2="756.3438"/><text fill="#000000" font-family="Serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="24" x="184.5" y="751.2778">401</text><!--MD5=[763af06b698587df0a943517e1dfc951]
@startuml
skinparam monochrome true
skinparam defaultFontName Serif
actor Pengguna
boundary "Next.js UI" as UI
control "AuthController + middleware" as API
entity "Pengguna / session store" as DB
Pengguna -> UI: isi credential
UI -> API: GET /auth/csrf
API - -> UI: token CSRF + cookie sesi
UI -> API: POST /auth/login + token
API -> DB: cari akun, verifikasi hash
alt credential salah
 API - -> UI: 401, pesan generik
else credential benar
 API -> DB: login dan regenerasi sesi
 API - -> UI: identitas + role
 UI -> API: GET /auth/me (cookie)
 API -> DB: verifikasi sesi
 API - -> UI: identitas + role
 UI -> API: request fitur terproteksi
 alt role tidak berhak
  API - -> UI: 403
 else role berhak
  API - -> UI: hasil fitur
 end
 Pengguna -> UI: Keluar
 UI -> API: POST /auth/logout + CSRF
 API -> DB: invalidasi sesi / remember token
 API - -> UI: 200
 UI -> API: request dengan cookie lama
 API - -> UI: 401
end
@enduml

